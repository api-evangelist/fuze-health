name: Fuze Health
description: 'Fuze Health is a technology-powered healthcare company delivering comprehensive,
  patient-focused care at scale across three business units: FuzeRx (digital pharmacy
  and prescription fulfillment with patient engagement tools), Fuze Services (diagnostics,
  screening, clinical and genomics programs), and Fuze Technologies (proprietary healthcare
  software and consulting for partners). The company operates a unified digital platform
  that simplifies access, strengthens engagement, and supports patients throughout
  their care journeys, and reports serving 22 million patients, delivering 31 million
  prescriptions, and reaching 90% payer coverage. Fuze Health is backed by SoftBank
  Vision Fund. No public API or developer surface is published at this time.'
